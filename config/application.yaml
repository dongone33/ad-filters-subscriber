# 参考 `application-example.yaml` 并在处添加订阅规则，请注意缩进
# Refer to `application-example.yaml` and add subscription rules there，please note the indentation
application:

  # 规则源配置
  input:
    - name: 'AdGuard Base Filter'
      path: 'https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt'
      type: dns

    - name: 'anti-AD'
      path: 'https://anti-ad.net/easylist.txt'
      type: easylist

    - name: 'AWAvenue-Ads-Rule'
      path: 'https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt'
      type: easylist
      
    - name: 'Halflife-Rule'
      path: 'https://cdn.jsdelivr.net/gh/sbwml/halflife-list@master/ad.txt'
      type: easylist

    - name: 'DD-AD'
      path: 'https://raw.githubusercontent.com/afwfv/DD-AD/refs/heads/release/dns.txt'
      type: easylist

    - name: 'damengzhu'
      path: 'https://raw.githubusercontent.com/damengzhu/banad/main/jiekouAD.txt'
      type: easylist
      
    - name: 'qy-Ads-Rule'
      path: 'https://raw.gitcode.com/rssv/qy-Ads-Rule/raw/main/black.txt'
      type: easylist
      
    - name: 'SMAdHosts'
      path: 'https://raw.githubusercontent.com/2Gardon/SM-Ad-FuckU-hosts/master/SMAdHosts'
      type: host
      
    - name: '那个谁520规则'
      path: 'https://raw.githubusercontent.com/qq5460168/666/master/dns.txt'
      type: dns

    - name: 'TTDNS'
      path: 'https://raw.githubusercontent.com/TTDNS/Cat/refs/heads/main/DNS.TXT'
      type: easylist
      
    - name: '茯苓广告规则'
      path: 'https://raw.githubusercontent.com/Kuroba-Sayuki/FuLing-AdRules/Master/FuLingRules/FuLingBlockList.txt'
      type: easylist
      
    - name: 'HG'
      path: 'https://raw.githubusercontent.com/2771936993/HG/main/hg1.txt'
      type: easylist
      
    - name: 'adg-kall-dns-Rule'
      path: 'https://www.kbsml.com/wp-content/uploads/adblock/adguard/adg-kall-dns.txt'
      type: easylist

    - name: '喵二黑名单'
      path: 'https://raw.githubusercontent.com/miaoermua/AdguardFilter/main/rule.txt'
      type: easylist
      
    - name: 'anti-AD-plus_blocklist'
      path: 'https://raw.githubusercontent.com/mphin/adguardhome_rules/main/Blacklist.txt'
      type: easylist
      
    #以下是白名单
    - name: '茯苓允许列表'
      path: 'https://raw.githubusercontent.com/Kuroba-Sayuki/FuLing-AdRules/Master/FuLingRules/FuLingAllowList.txt'
      type: easylist   
      
    - name: '那个谁520广告白名单'
      path: 'https://raw.githubusercontent.com/qq5460168/666/master/allow.txt'
      type: easylist   
      
    - name: 'anti-AD-plus_allowlist'
      path: 'https://raw.githubusercontent.com/mphin/adguardhome_rules/main/Allowlist.txt'
      type: easylist 
      
    - name: 'DNS-Kuner_allowlist'
      path: 'https://raw.githubusercontent.com/Kuner-mw/DNS-Kuner/main/FilterRules/allowlist.txt'
      type: easylist 
    
    - name: '喵二白名单'
      path: 'https://raw.githubusercontent.com/miaoermua/AdguardFilter/main/whitelist.txt'
      type: easylist 
    # 按需继续添加你自己的订阅源，格式同上，name 不能重复

  # 输出配置
  output:
    #文件头配置，将自动作为注释添加至每个规则文件开始
    #可使用占位符 ${name}、${type}、${desc} 以及 ${date} (当前日期)、${total} (规则总数)
    file_header: |
      ADFS AdBlock ${type}
      Last Modified: ${date}
      Total Size: ${total}
      Homepage: https://github.com/dongone33/ad-filters-subscriber

    files:
      # 黑名单（原有的合并规则，保持不变）
      - name: Blacklist.txt
        type: dns
        desc: 'ADFS EasyList'
        mode:
          - deny

      # 单独新增：白名单（只含 @@ 放行规则）
      - name: Allowlist.txt
        type: dns
        desc: 'ADFS EasyList Allow'
        mode:
          - allow
