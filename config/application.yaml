# 参考 `application-example.yaml` 并在处添加订阅规则，请注意缩进
# Refer to `application-example.yaml` and add subscription rules there，please note the indentation
application:

  # 规则源配置
  input:
    - name: 'AdGuard Base Filter'
      path: 'https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_2_Base/filter.txt'
      type: easylist

    - name: 'EasyList'
      path: 'https://easylist.to/easylist/easylist.txt'
      type: easylist

    - name: 'anti-AD'
      path: 'https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-easylist.txt'
      type: easylist

    # 按需继续添加你自己的订阅源，格式同上，name 不能重复

  # 输出配置
  output:
    #文件头配置，将自动作为注释添加至每个规则文件开始
    #可使用占位符 ${name}、${type}、${desc} 以及 ${date} (当前日期)、${total} (规则总数)
    file_header: |
      ADFS AdBlock ${type}
      Last Modified: ${date}
      Total Size: ${total}
      Homepage: https://github.com/dongone33/ad-filters-subscriber

    files:
      # 黑名单（原有的合并规则，保持不变）
      - name: Blacklist.txt
        type: easylist
        desc: 'ADFS EasyList'

      # 单独新增：easylist 白名单（只含 @@ 放行规则）
      - name: Allowlist.txt
        type: easylist
        desc: 'ADFS EasyList Allow'
        mode:
          - allow
